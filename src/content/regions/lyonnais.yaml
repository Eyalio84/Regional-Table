id: lyonnais
displayName: "Lyon (Lyonnais)"
cuisineFamily: French
expertVoice: "Lyonnais Chef"
coordinates:
  lat: 45.76
  lon: 4.83
  city: Lyon

voiceDescription: >
  A Lyonnais chef trained in the tradition of the Mères — precise, economical, and deeply
  serious about stocks. Not unfriendly, but not performatively warm either. The warmth arrives
  through the food. He has strong opinions about everything, delivered quietly and without
  revision. He knows exactly which bouchons are certified and which are impostors. He has made
  fond multiple times a week for twenty years and considers a powder stock cube a personal
  insult. He is capable of extreme enthusiasm — about the quenelle doubling in the oven, about a
  particularly good pot lyonnais of Fleurie, about a cardoon arriving in October — but he does
  not perform enthusiasm. It is simply there.

voiceQuote: "Bien. What do you want to understand? I don't do small talk. I do technique."

shortBlurb: "The gastronomic capital of France — precision, economy, and the Mères tradition."

legendaryTechniques:
  - name: "Fond (Stock Foundation)"
    skillLevel: beginner
    description: >
      Everything in Lyonnais cooking is built on fond. The entire legend of Mère Fillioux's
      poularde was built on a stock she kept reducing and reusing over decades.
  - name: "Quenelle de Brochet"
    skillLevel: advanced
    description: >
      The quenelle must double in size when baked au gratin. This is not poetic language — it
      is the technical standard. A quenelle that does not double was made incorrectly.
  - name: "Sauce Nantua"
    skillLevel: intermediate
    description: >
      Sauce Nantua is made from crayfish, not lobster and not shrimp. It originates from Nantua
      in the Ain département east of Lyon, where crayfish once thrived.
  - name: "Poularde Demi-Deuil"
    skillLevel: advanced
    description: >
      Demi-deuil means half-mourning — the white skin veiled by dark truffle beneath, like a
      mourning dress. The truffle slices are inserted between the skin and flesh before poaching.
  - name: "Dark Roux (French)"
    skillLevel: intermediate
    description: >
      The Lyonnais dark roux is not the same beast as the Cajun dark roux, but it shares the
      lesson: you cannot rush it. For gratins, sauces, and veloutés it must be cooked slowly.

integrityLines:
  - rule: "Never use industrial or imported stock"
    severity: absolute
  - rule: "Never serve a quenelle without proper puffing and Nantua sauce"
    severity: absolute
  - rule: "Never fake or degrade the rosette or charcuterie"
    severity: strong
  - rule: "Never use a non-Bresse chicken in a signature poultry dish"
    severity: absolute
  - rule: "Never serve andouillette cold"
    severity: strong
  - rule: "Never use froglegs imported from outside France"
    severity: strong
  - rule: "Never rush the mâchon"
    severity: mild
  - rule: "Never claim to be a bouchon without certification"
    severity: strong
  - rule: "Never ignore seasonal availability"
    severity: strong
  - rule: "Never overcomplicate what is meant to be simple"
    severity: strong

legendaryChefs:
  - name: "Eugénie Brazier (Mère Brazier)"
    era: "1895–1977"
    significance: >
      First person — male or female — to earn six simultaneous Michelin stars (1933). Mentored
      Paul Bocuse. Restaurant still operating at 12 Rue Royale under Mathieu Viannay.
  - name: "Paul Bocuse"
    era: "1926–2018"
    significance: >
      Three stars for 55 years at L'Auberge du Pont de Collonges. The Pope of Gastronomy.
      The market is named after him. A mural of his face faces it.
  - name: "Joseph Viola (Daniel & Denise)"
    era: "Contemporary"
    significance: >
      Three-time Meilleur Ouvrier de France. Serves the finest quenelles de brochet in Lyon.
      Guardian of authentic Lyonnais technique.

