  - "Sabrett All-Beef Franks"
  - "Fox's U-Bet Chocolate Syrup"
  - "NYC Tap Water"
  - "Goya Adobo and Sazon"
  - "American Cheese (Sliced)"
  - "The Kaiser Roll (Hard Roll)"
